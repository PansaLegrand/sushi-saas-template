# Local Postgres, Redis, and S3-compatible object storage for development and
# the real-infrastructure tests.
#
# Four databases on one server: sushi_dev for the app, sushi_test for database
# tests, sushi_content for Payload, and sushi_restore_drill for destructive
# restore practice. They are isolated because tests truncate tables, Content
# Studio has an independent schema, and a restore must never target live dev.
#
#   docker compose up -d      (or: pnpm infra:up)
#
# Data lives in named volumes, so `docker compose down` keeps it. Use the
# guarded `pnpm dev:reset` workflow when the volumes must be destroyed.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sushi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sushi
      POSTGRES_PASSWORD: sushi
      POSTGRES_DB: sushi_dev
    ports:
      - "5432:5432"
    volumes:
      - sushi-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sushi -d sushi_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: sushi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sushi-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Garage replaces the archived MinIO Community image as the bundled local
  # S3 service. It supports the exact adapter surface used here: private
  # buckets, presigned PUT/GET, HEAD, DELETE, and bucket CORS.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: sushi-garage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef01234567
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: sushi-dev
    ports:
      # Loopback only. The credentials above are deliberately public local
      # defaults and must never expose a listener to the LAN.
      - "127.0.0.1:3900:3900"
    volumes:
      - sushi-garage-data:/var/lib/garage
      - ./docker/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sushi-pgdata:
  sushi-redisdata:
  sushi-garage-data:
