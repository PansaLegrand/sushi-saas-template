name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# New jobs inherit no write capability by accident. Individual jobs must opt in
# to the smallest additional permission they actually need.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Real Postgres and Redis for the infrastructure tier (tests/db). Those
    # tests cover constraints, SKIP LOCKED, and distributed counters that mocks
    # cannot prove; without these services they would silently lose coverage.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sushi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-better-auth-secret-change-me
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Separate from DATABASE_URL on purpose: the database tier truncates
      # tables, so it must never inherit whatever the app is pointed at.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sushi_test
      TEST_REDIS_URL: redis://localhost:6379
      RATE_LIMIT_REDIS_URL: redis://localhost:6379
      RATE_LIMIT_IP_SOURCE: x-forwarded-for
      STRIPE_PRIVATE_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STORAGE_BUCKET: ci-placeholder
      STORAGE_REGION: auto
      STORAGE_ACCESS_KEY: ci-placeholder
      STORAGE_SECRET_KEY: ci-placeholder
      RESEND_API_KEY: re_ci_placeholder
      RESEND_WEBHOOK_SECRET: ci-only-resend-webhook-secret-at-least-32-characters
      EMAIL_FROM: CI <ci@example.com>
      CONTENT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sushi_content_ci
      PAYLOAD_SECRET: ci-only-content-studio-secret-at-least-32-characters
      CONTENT_MARKETING_SECRET: ci-only-content-marketing-secret-at-least-32-characters
      MARKETING_UNSUBSCRIBE_SECRET: ci-only-unsubscribe-secret-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Content Studio types
        run: pnpm studio:generate

      - name: Lint
        run: pnpm lint

      - name: Validate container bundle
        run: pnpm containers:check

      - name: Migrate test database
        run: pnpm test:db:setup

      - name: Check data integrity
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:integrity

      # Coverage rather than a plain run: the thresholds in vitest.config.mts
      # are the ratchet, and they only bite if CI measures them.
      - name: Test
        run: pnpm test:cov

      - name: Check ledger CPU budget
        run: pnpm benchmark:ledger -- --check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Install Chromium for production smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke production artifacts
        run: pnpm test:production

  core-onboarding:
    name: Fresh Core onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      # Deliberately do not restore node_modules or install the full workspace:
      # this job proves the commands a first-time Core adopter actually runs.
      - name: Install Core only
        run: pnpm starter core install

      - name: Provision Core local infrastructure
        run: pnpm starter core setup

      - name: Check Core environment and optional app exclusion
        run: |
          pnpm starter core doctor
          test ! -d apps/content-studio/node_modules
          test ! -e apps/content-studio/.env.development.local
          studio_count=$(docker compose exec -T postgres psql -U sushi -d postgres -tAc "SELECT count(*) FROM pg_database WHERE datname = 'sushi_content'")
          test "$studio_count" = "0"

      - name: Seed the local demo twice to prove replay safety
        run: |
          pnpm dev:seed
          pnpm dev:seed

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise the first Core result with its background worker
        env:
          E2E_ALLOW_MUTATIONS: "1"
        run: pnpm exec playwright test --config playwright.core.config.ts

      - name: Upload Core onboarding diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-onboarding-report
          path: |
            playwright-report/core/
            test-results/core-onboarding/
          retention-days: 7

  e2e:
    name: Full-stack browser contracts
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Provision local infrastructure
        run: ./scripts/setup.sh development --non-interactive --skip-install

      - name: Verify local infrastructure
        run: pnpm dev:doctor

      - name: Run Playwright contracts
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/
          retention-days: 7
