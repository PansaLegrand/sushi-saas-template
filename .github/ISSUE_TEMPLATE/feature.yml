name: Feature request
description: Propose a reusable improvement to the starter.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recurring SaaS-starter problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, public API, and defaults.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can adopters do today, and why is that insufficient?
  - type: dropdown
    id: impact
    attributes:
      label: Compatibility impact
      options:
        - Additive
        - Requires configuration
        - Requires a migration
        - Breaking change
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This belongs in a general-purpose starter rather than one product.
          required: true
